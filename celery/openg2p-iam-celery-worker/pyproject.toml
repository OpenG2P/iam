[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-iam-celery-worker"
version = "1.5.0"
description = "OpenG2P IAM Celery worker"
requires-python = ">=3.10"
dependencies = [
  "openg2p-fastapi-common",
  "iam-core",
  "celery[redis]",
  "asyncpg",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openg2p_iam_celery_worker"]
