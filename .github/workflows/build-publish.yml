name: Build & Publish

# Thin caller: all versioning/build/publish logic lives in
# openg2p/openg2p-packaging@v1. This file declares only what THIS repo contains.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its release version e.g. 1.0.1 (a bare N.N.N, not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # Docker Hub under the default openg2p namespace -> openg2p/<name>, which is
      # where these images already live. `pins` are per-image: the API Dockerfiles
      # declare ARG FASTAPI_COMMON_REF, and `develop` is a BRANCH -- without
      # resolving it to a SHA, two builds of the same commit produce different
      # images.
      images: |
        [
          {
            "name": "iam-staff-portal-api",
            "repo": "openg2p/iam-staff-portal-api",
            "dockerfile": "docker/iam-staff-portal-api/Dockerfile",
            "pins": [
              {
                "arg": "FASTAPI_COMMON_REF",
                "repo": "https://github.com/openg2p/openg2p-fastapi-common",
                "ref": "1.2.1"
              }
            ]
          },
          {
            "name": "iam-agent-portal-api",
            "repo": "openg2p/iam-agent-portal-api",
            "dockerfile": "docker/iam-agent-portal-api/Dockerfile",
            "pins": [
              {
                "arg": "FASTAPI_COMMON_REF",
                "repo": "https://github.com/openg2p/openg2p-fastapi-common",
                "ref": "1.2.1"
              }
            ]
          },
          {
            "name": "iam-bene-portal-api",
            "repo": "openg2p/iam-bene-portal-api",
            "dockerfile": "docker/iam-bene-portal-api/Dockerfile",
            "pins": [
              {
                "arg": "FASTAPI_COMMON_REF",
                "repo": "https://github.com/openg2p/openg2p-fastapi-common",
                "ref": "1.2.1"
              }
            ]
          },
          {
            "name": "iam-staff-ui",
            "repo": "openg2p/iam-staff-ui",
            "dockerfile": "docker/iam-staff-ui/Dockerfile",
            "context": "iam-staff-ui"
          }
        ]

      chart-path: deployments/charts/openg2p-iam-service

      chart-image-paths: |
        [".iamStaffPortalApi.image.tag", ".iamAgentPortalApi.image.tag", ".iamStaffUi.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
