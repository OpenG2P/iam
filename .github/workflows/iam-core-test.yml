name: Test (iam-core)

# Runs the iam-core test suite. Mirrors the reference setup: disabled on the
# develop branch, runs on other branches and PRs when iam-core changes.
on:
  pull_request:
    branches-ignore:
      - 1.2.1
    paths:
      - 'iam-core/**'
      - '.github/workflows/iam-core-test.yml'
  push:
    branches-ignore:
      - 1.2.1
    paths:
      - 'iam-core/**'
      - '.github/workflows/iam-core-test.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "v1.1.7"
        type: string

concurrency:
  group: check-iam-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test with ${{ matrix.py }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.12"
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup python ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          # External lib (openg2p-fastapi-common) from git.
          python -m pip install \
            "git+https://github.com/openg2p/openg2p-fastapi-common@${{ inputs.fastapi_common_ref || 'v1.1.7' }}#subdirectory=openg2p-fastapi-common"
          # In-repo library (not on PyPI) + test tooling.
          python -m pip install -e ./iam-core
          python -m pip install pytest pytest-asyncio
      - name: Run test suite
        run: pytest iam-core/tests
