name: Test (iam-staff-portal-api)

on:
  pull_request:
    branches-ignore:
      - 1.2
    paths:
      - 'iam-staff-portal-api/**'
      - 'iam-core/**'
      - '.github/workflows/iam-staff-portal-api-test.yml'
  push:
    branches-ignore:
      - 1.2
    paths:
      - 'iam-staff-portal-api/**'
      - 'iam-core/**'
      - '.github/workflows/iam-staff-portal-api-test.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "develop"
        type: string

concurrency:
  group: check-iam-staff-portal-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test with ${{ matrix.py }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.12"
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup python ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/openg2p/openg2p-fastapi-common@${{ inputs.fastapi_common_ref || '1.1' }}#subdirectory=openg2p-fastapi-common"
          python -m pip install -e "./iam-core[dev]"
          python -m pip install -e "./iam-staff-portal-api[dev]"
      - name: Run test suite
        run: pytest iam-staff-portal-api/tests
