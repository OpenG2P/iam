name: Publish IAM portal API Dockers

# Builds the IAM portal API images from the LOCAL in-repo source (iam-core +
# each iam-*-portal-api). The image tag is this repo's ref (branch name or git
# tag) — so a build on `develop` publishes the `develop` tag.
#
# Only openg2p-fastapi-common is external; its ref is a workflow_dispatch input
# (shown with a default in the Actions UI). Push/tag-triggered builds use the
# default below.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'iam-core/**'
      - 'iam-staff-portal-api/**'
      - 'iam-agent-portal-api/**'
      - 'iam-bene-portal-api/**'
      - 'docker/**'
      - '.github/workflows/docker-build-apis.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "v1.1.6"
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iam-staff-portal-api
            image: openg2p/iam-staff-portal-api
            dockerfile: docker/iam-staff-portal-api/Dockerfile
          - name: iam-agent-portal-api
            image: openg2p/iam-agent-portal-api
            dockerfile: docker/iam-agent-portal-api/Dockerfile
          - name: iam-bene-portal-api
            image: openg2p/iam-bene-portal-api
            dockerfile: docker/iam-bene-portal-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || 'v1.1.6' }}
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=OpenG2P IAM portal API service image
            org.openg2p.service.name=${{ matrix.name }}
