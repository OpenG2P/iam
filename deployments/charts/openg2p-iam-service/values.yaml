global:
  iamHostname: "iam.trial.openg2p.org"

  # Database
  postgresqlHost: commons-postgresql
  iamDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  iamDBPort: 5432
  iamDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  iamDBSecret: '{{ .Release.Name }}'
  iamDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # Redis
  redisInstallationName: 'commons-redis'
  # Refresh token TTL in Redis (default 1800 = 30 minutes)
  authRefreshTokenTtlSeconds: 1800
  # Double-submit CSRF validation on state-changing IAM staff-portal-api requests.
  csrfEnabled: true
  # Role permission cache TTL in seconds
  cacheExpireSeconds: 10

  # Security & Authentication
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ .Values.global.keycloakRealm }}'
  keycloakExternalIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ .Values.global.keycloakRealm }}'

  # Cookie domain (dot-prefixed so cookies work across subdomains)
  authCookieDomain: '.{{ .Release.Namespace }}.openg2p.org'

  # Staff Portal redirect URL
  staffPortalDefaultRedirectUri: 'https://staff-portal.trial.openg2p.org'

  # ── Agents ────────────────────────────────────────────────────────────────
  # Agents are NOT staff. They authenticate in their own realm against their own
  # client, so an agent token is meaningless to a staff API and vice versa.
  # Only read when iamAgentPortalApi.enabled is true.
  agentKeycloakRealm: agent
  agentKeycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ .Values.global.agentKeycloakRealm }}'
  agentKeycloakExternalIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ .Values.global.agentKeycloakRealm }}'
  # Where the agent lands after logging in — the agent portal SPA served by the
  # registry chart.
  agentPortalDefaultRedirectUri: 'https://agent-portal.trial.openg2p.org'

  # Application URLs (populated by parent chart per environment)
  keycloakApplicationUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  registryApplicationUrl: 'https://registry.{{ .Release.Namespace }}.openg2p.org'
  minioApplicationUrl: 'https://minio.{{ .Release.Namespace }}.openg2p.org'
  supersetApplicationUrl: 'https://superset.{{ .Release.Namespace }}.openg2p.org'
  iamStaffUiApplicationUrl: 'https://iam-staff-ui.{{ .Release.Namespace }}.openg2p.org'

  # Backend API URLs used by iam-staff-ui BFF (override per environment)
  masterDataApiUrl: 'http://commons-services-master-data-api'

postgres-init:
  enabled: true
  postgresql:
    host: "{{ .Values.global.postgresqlHost }}"
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.iamDB $ }}'
      user: '{{ tpl .Values.global.iamDBUser $ }}'
      secret: '{{ tpl .Values.global.iamDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.iamDBUserPasswordKey $ }}'

iamStaffPortalApi:
  enabled: true
  nameOverride: iam-staff-portal-api
  hostname: 'staff-{{ tpl .Values.global.iamHostname $ }}'
  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  updateStrategy:
    type: RollingUpdate

  serviceAccount:
    create: false
    name: ""

  image:
    repository: registry.gitlab.com/openg2p/iam/iam-staff-portal-api
    # Placeholder — the real tag is injected at publish time by the Build &
    # Publish CI (.gitlab-ci.yml -> openg2p/packaging@v1).
    tag: "develop"
    pullPolicy: Always

  podSecurityContext:
    enabled: false

  containerSecurityContext:
    enabled: false

  openapiRootPath: /
  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.iamStaffPortalApi.hostname $ }}'
      gateway: "internal"
      destination: ""
      destinationPort: '{{ .Values.iamStaffPortalApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.iamStaffPortalApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # ---------------------------------------------------------------------------
  # Login providers — rendered as a Secret and mounted into the container.
  # Each entry maps to a row in the login_providers DB table.
  # Keycloak endpoints are auto-derived from keycloakBaseUrl + realm.
  # ---------------------------------------------------------------------------
  loginProviders:
    - id: 1
      userType: "staff"
      providerName: "Keycloak"
      description: "Login with Keycloak"
      realm: "staff"
      clientId: "staff-portal"
      clientSecret: "staff_portal_secret"
      tokenEndpointAuthMethod: "client_secret_basic"
      scope: "openid profile email"
      enablePkce: true
      active: true

  dataMountPath: /opt/iam-staff-portal-data

  envVars:
    IAM_STAFF_DB_DRIVER: "postgresql+asyncpg"
    IAM_STAFF_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    IAM_STAFF_DB_DBNAME: '{{ tpl .Values.global.iamDB $ }}'
    IAM_STAFF_DB_PORT: '{{ .Values.global.iamDBPort }}'
    IAM_STAFF_DB_USERNAME: '{{ tpl .Values.global.iamDBUser $ }}'
    IAM_STAFF_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    IAM_STAFF_KEYCLOAK_BASE_URL: '{{ .Values.global.keycloakBaseUrl }}'
    IAM_STAFF_KEYCLOAK_ISSUER_URL: '{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}'
    IAM_STAFF_LOGIN_PROVIDERS_TABLE_ENABLED: true
    IAM_STAFF_LOGIN_PROVIDERS_TABLE_NAME: "login_providers"
    IAM_STAFF_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.redisInstallationName $ }}-master:6379/0'
    IAM_STAFF_AUTH_TRANSACTION_STORE_BACKEND: "redis"
    IAM_STAFF_CACHE_EXPIRE_SECONDS: '{{ .Values.global.cacheExpireSeconds }}'
    IAM_STAFF_AUTH_REFRESH_TOKEN_TTL_SECONDS: '{{ .Values.global.authRefreshTokenTtlSeconds }}'
    IAM_STAFF_AUTH_ENABLED: true
    IAM_STAFF_CSRF_ENABLED: '{{ .Values.global.csrfEnabled }}'
    IAM_STAFF_AUTH_VERIFY_SSL: false
    IAM_STAFF_AUTH_COOKIE_HTTPONLY: true
    IAM_STAFF_AUTH_COOKIE_PATH: "/"
    IAM_STAFF_AUTH_COOKIE_DOMAIN: '{{ tpl .Values.global.authCookieDomain $ }}'
    IAM_STAFF_AUTH_COOKIE_MAX_AGE: 1800
    IAM_STAFF_AUTH_COOKIE_SET_EXPIRES: true
    IAM_STAFF_DATA_APPLICATION_URLS__KEYCLOAK_APPLICATION_URL: '{{ tpl .Values.global.keycloakApplicationUrl $ }}'
    IAM_STAFF_DATA_APPLICATION_URLS__REGISTRY_APPLICATION_URL: '{{ tpl .Values.global.registryApplicationUrl $ }}'
    IAM_STAFF_DATA_APPLICATION_URLS__MINIO_APPLICATION_URL: '{{ tpl .Values.global.minioApplicationUrl $ }}'
    IAM_STAFF_DATA_APPLICATION_URLS__SUPERSET_APPLICATION_URL: '{{ tpl .Values.global.supersetApplicationUrl $ }}'
    IAM_STAFF_DATA_APPLICATION_URLS__IAM_STAFF_UI_APPLICATION_URL: '{{ tpl .Values.global.iamStaffUiApplicationUrl $ }}'
    IAM_STAFF_KEYCLOAK_CLIENT_ID: "iam-staff-ui"
    IAM_STAFF_AUTH_PROVIDER_API_URL: 'http://{{ .Release.Name }}-iam-staff-portal-api'
    IAM_STAFF_KEYCLOAK_ADMIN_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
    IAM_STAFF_KEYCLOAK_REALM: '{{ .Values.global.keycloakRealm }}'

    # API specific middleware configs
    IAM_STAFF_CORS_ALLOW_ORIGINS: '{{ list (tpl .Values.global.registryApplicationUrl $) (tpl .Values.global.staffPortalDefaultRedirectUri $) (tpl .Values.global.iamStaffUiApplicationUrl $) | toJson }}'

  envVarsFrom:
    IAM_STAFF_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.iamDBSecret $ }}'
        key: '{{ tpl .Values.global.iamDBUserPasswordKey $ }}'
    IAM_STAFF_DATA_CLIENT_SECRETS__STAFF_PORTAL_SECRET:
      secretKeyRef:
        name: staff-portal
        key: client_secret

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
      - 'sh'
    args:
      - '-c'
      - 'until psql "postgresql://${IAM_STAFF_DB_USERNAME}:${IAM_STAFF_DB_PASSWORD}@${IAM_STAFF_DB_HOSTNAME}:${IAM_STAFF_DB_PORT}/${IAM_STAFF_DB_DBNAME}" -c "SELECT 1" > /dev/null 2>&1; do echo "Waiting for database ${IAM_STAFF_DB_DBNAME} to be ready..."; sleep 3; done'
    containerSecurityContext:
      enabled: false

# ---------------------------------------------------------------------------
# IAM Agent Portal API — login for FIELD AGENTS (verifiable credential issuance).
#
# A distinct audience from staff, not a variant of it: its own Keycloak realm,
# its own login provider, its own hostname. A staff token grants nothing on an
# agent API and vice versa — which is the point, since agents can mint signed
# credentials and administer nothing.
#
# The agent's own login is a plain Keycloak password login. eSignet is NOT used
# here: that authenticates the BENEFICIARY, later, inside the registry's
# issuance flow.
#
# Shares the IAM database with the staff API (one `login_providers` table,
# rows distinguished by user_type).
# ---------------------------------------------------------------------------

iamAgentPortalApi:
  # ON by default: registries that ship an agent portal (Farmer Registry does)
  # need this to exist for an agent to log in at all.
  #
  # Safe to have on before the `agent` realm exists: the API starts regardless —
  # the login provider row is seeded into the DB and the client secret is mounted
  # `optional`. It simply cannot complete a login until the realm and client are
  # provisioned. Set to false for a deployment with no agent audience.
  enabled: true
  nameOverride: iam-agent-portal-api
  hostname: 'agent-{{ tpl .Values.global.iamHostname $ }}'
  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  updateStrategy:
    type: RollingUpdate

  serviceAccount:
    create: false
    name: ""

  image:
    repository: registry.gitlab.com/openg2p/iam/iam-agent-portal-api
    # Placeholder — the real tag is injected at publish time by the Build &
    # Publish CI (.gitlab-ci.yml -> openg2p/packaging@v1).
    tag: "develop"
    pullPolicy: Always

  podSecurityContext:
    enabled: false

  containerSecurityContext:
    enabled: false

  openapiRootPath: /
  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.iamAgentPortalApi.hostname $ }}'
      gateway: "internal"
      destination: ""
      destinationPort: '{{ .Values.iamAgentPortalApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.iamAgentPortalApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # ---------------------------------------------------------------------------
  # Login providers — rendered as a Secret and mounted into the container.
  # Each entry maps to a row in the login_providers DB table.
  # Keycloak endpoints are auto-derived from keycloakBaseUrl + realm.
  # ---------------------------------------------------------------------------
  # The agent's login provider. `id` must not collide with the staff row: both
  # APIs share one `login_providers` table, distinguished by user_type.
  loginProviders:
    - id: 10
      userType: "agent"
      providerName: "Keycloak"
      description: "Login with Keycloak"
      realm: "agent"
      clientId: "agent-portal"
      clientSecret: "agent_portal_secret"
      tokenEndpointAuthMethod: "client_secret_basic"
      scope: "openid profile email"
      enablePkce: true
      active: true

  dataMountPath: /opt/iam-agent-portal-data

  envVars:
    IAM_AGENT_DB_DRIVER: "postgresql+asyncpg"
    IAM_AGENT_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    IAM_AGENT_DB_DBNAME: '{{ tpl .Values.global.iamDB $ }}'
    IAM_AGENT_DB_PORT: '{{ .Values.global.iamDBPort }}'
    IAM_AGENT_DB_USERNAME: '{{ tpl .Values.global.iamDBUser $ }}'
    IAM_AGENT_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    IAM_AGENT_KEYCLOAK_BASE_URL: '{{ .Values.global.keycloakBaseUrl }}'
    IAM_AGENT_KEYCLOAK_ISSUER_URL: '{{ tpl .Values.global.agentKeycloakExternalIssuerUrl $ }}'
    IAM_AGENT_LOGIN_PROVIDERS_TABLE_ENABLED: true
    IAM_AGENT_LOGIN_PROVIDERS_TABLE_NAME: "login_providers"
    IAM_AGENT_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.redisInstallationName $ }}-master:6379/0'
    IAM_AGENT_AUTH_TRANSACTION_STORE_BACKEND: "redis"
    IAM_AGENT_CACHE_EXPIRE_SECONDS: '{{ .Values.global.cacheExpireSeconds }}'
    IAM_AGENT_AUTH_REFRESH_TOKEN_TTL_SECONDS: '{{ .Values.global.authRefreshTokenTtlSeconds }}'
    IAM_AGENT_AUTH_ENABLED: true
    IAM_AGENT_CSRF_ENABLED: '{{ .Values.global.csrfEnabled }}'
    IAM_AGENT_AUTH_VERIFY_SSL: false
    IAM_AGENT_AUTH_COOKIE_HTTPONLY: true
    IAM_AGENT_AUTH_COOKIE_PATH: "/"
    IAM_AGENT_AUTH_COOKIE_DOMAIN: '{{ tpl .Values.global.authCookieDomain $ }}'
    IAM_AGENT_AUTH_COOKIE_MAX_AGE: 1800
    IAM_AGENT_AUTH_COOKIE_SET_EXPIRES: true
    IAM_AGENT_DATA_APPLICATION_URLS__IAM_AGENT_UI_APPLICATION_URL: '{{ tpl .Values.global.iamStaffUiApplicationUrl $ }}'
    # The client whose ROLES are read when resolving an agent's permissions.
    # Must be the same client the Registry's agent-portal-api resolves against
    # (its global.agentKeycloakClientId), or an agent authorised here would be
    # unauthorised there.
    IAM_AGENT_KEYCLOAK_CLIENT_ID: "agent-portal"
    IAM_AGENT_AUTH_PROVIDER_API_URL: 'http://{{ .Release.Name }}-iam-agent-portal-api'
    IAM_AGENT_KEYCLOAK_ADMIN_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
    IAM_AGENT_KEYCLOAK_REALM: '{{ .Values.global.agentKeycloakRealm }}'

    # API specific middleware configs
    IAM_AGENT_CORS_ALLOW_ORIGINS: '{{ list (tpl .Values.global.agentPortalDefaultRedirectUri $) | toJson }}'

  envVarsFrom:
    IAM_AGENT_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.iamDBSecret $ }}'
        key: '{{ tpl .Values.global.iamDBUserPasswordKey $ }}'
    # The agent client's secret, created in the agent realm (by keycloak-init on
    # the registry side). `optional` so the chart still installs before the realm
    # has been provisioned — the API simply cannot complete a login until it is.
    IAM_AGENT_DATA_CLIENT_SECRETS__AGENT_PORTAL_SECRET:
      secretKeyRef:
        name: agent-portal
        key: client_secret
        optional: true

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
      - 'sh'
    args:
      - '-c'
      - 'until psql "postgresql://${IAM_AGENT_DB_USERNAME}:${IAM_AGENT_DB_PASSWORD}@${IAM_AGENT_DB_HOSTNAME}:${IAM_AGENT_DB_PORT}/${IAM_AGENT_DB_DBNAME}" -c "SELECT 1" > /dev/null 2>&1; do echo "Waiting for database ${IAM_AGENT_DB_DBNAME} to be ready..."; sleep 3; done'
    containerSecurityContext:
      enabled: false

# ---------------------------------------------------------------------------
# IAM Staff UI (Next.js BFF) — Applications / Login Providers admin
# ---------------------------------------------------------------------------
iamStaffUi:
  enabled: true
  nameOverride: iam-staff-ui
  hostname: 'iam-staff-ui.{{ .Release.Namespace }}.openg2p.org'
  replicaCount: 1

  image:
    repository: openg2p/iam-staff-ui
    tag: "develop"
    pullPolicy: Always

  containerPort: 3000

  service:
    type: ClusterIP
    port: 80

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.iamStaffUi.hostname $ }}'
      gateway: "internal"
      destination: ""
      destinationPort: '{{ .Values.iamStaffUi.service.port }}'
      prefix: /
      rewriteUri: ""

  envVars:
    HOSTNAME: "0.0.0.0"
    PORT: "3000"
    NODE_ENV: "production"
    BACKEND_API_URL: 'https://{{ tpl .Values.iamStaffPortalApi.hostname $ }}'
    MASTERDATA_API_URL: '{{ tpl .Values.global.masterDataApiUrl $ }}'
    LOGIN_PROVIDER_ID: "1"
    APPLICATION_MNEMONIC: "iam-staff-ui"
    COOKIE_DOMAIN: '{{ tpl .Values.global.authCookieDomain $ }}'
    PAGE_SIZE: "10"
