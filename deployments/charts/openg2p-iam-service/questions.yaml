questions:

# General
- variable: global.iamHostname
  description: Hostname under which the IAM service will be accessed
  type: string
  label: IAM Hostname
  group: General

- variable: global.postgresqlHost
  description: PostgreSQL server host
  type: string
  label: PostgreSQL Server Host
  group: General

- variable: global.keycloakBaseUrl
  description: Keycloak base URL for authentication
  type: string
  label: Keycloak Base URL
  group: General

- variable: postgres-init.enabled
  description: Run Postgres init job to create database and user
  type: boolean
  label: Postgres Init
  group: General

- variable: iamStaffPortalApi.enabled
  description: Install IAM Staff Portal API service
  type: boolean
  label: IAM Staff Portal API
  group: General

- variable: iamAgentPortalApi.enabled
  description: >-
    Install the IAM Agent Portal API — login for field agents who issue
    verifiable credentials. A distinct audience from staff, with its own
    Keycloak realm. Off unless this environment issues credentials.
  type: boolean
  label: IAM Agent Portal API
  group: General

- variable: global.agentKeycloakRealm
  description: >-
    Keycloak realm agents authenticate against. Kept separate from the staff
    realm so an agent token grants nothing on a staff API, and vice versa.
  type: string
  default: agent
  label: Agent Keycloak Realm
  group: General
  show_if: "iamAgentPortalApi.enabled=true"

- variable: global.agentPortalDefaultRedirectUri
  description: URL the agent is returned to after logging in (the agent portal SPA).
  type: string
  label: Agent Portal Redirect URL
  group: General
  show_if: "iamAgentPortalApi.enabled=true"

# Image
- variable: iamAgentPortalApi.image.tag
  description: Docker image tag for the IAM Agent Portal API
  type: string
  label: Agent Portal API Image Tag
  group: Image
  show_if: "iamAgentPortalApi.enabled=true"

- variable: iamStaffPortalApi.image.repository
  description: Docker image repository for the IAM Staff Portal API
  type: string
  label: Image Repository
  group: Image

- variable: iamStaffPortalApi.image.tag
  description: Docker image tag
  type: string
  label: Image Tag
  group: Image

# Scaling
- variable: iamStaffPortalApi.replicaCount
  description: Number of replicas
  type: int
  label: Replica Count
  group: Scaling

- variable: iamStaffPortalApi.autoscaling.enabled
  description: Enable Horizontal Pod Autoscaler
  type: boolean
  label: Enable HPA
  group: Scaling

- variable: global.csrfEnabled
  description: Enable double-submit CSRF validation on state-changing IAM staff-portal-api requests. Set false for local/dev troubleshooting only.
  type: boolean
  label: CSRF Enabled
  group: Security
