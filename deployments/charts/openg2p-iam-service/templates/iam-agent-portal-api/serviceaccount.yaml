{{- /*
  Gated on the component switch so a chart installed without an agent
  audience renders exactly what it rendered before this component existed.
  (The staff equivalents predate this and are left as they are.)
*/ -}}
{{- if .Values.iamAgentPortalApi.enabled }}
{{- $values := .Values.iamAgentPortalApi -}}
{{- $context := dict "Values" (merge (deepCopy $values) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- with $context -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iamAgentPortalApi.serviceAccountName" . }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end -}}
{{- end }}
