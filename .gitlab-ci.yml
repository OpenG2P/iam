# iam — build & publish on GitLab.
#
# Generated by openg2p/packaging ci/migrate/github-to-gitlab.sh, translated
# from this repo's GitHub caller. All versioning/build/publish logic lives
# centrally in openg2p/packaging@v1; this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/iam/<name>   (this project)
#   chart  -> openg2p/charts Helm registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  IMAGES: |
    [
      {
        "name": "iam-staff-portal-api",
        "dockerfile": "docker/iam-staff-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "1.1"
          }
        ]
      },
      {
        "name": "iam-agent-portal-api",
        "dockerfile": "docker/iam-agent-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "1.1"
          }
        ]
      },
      {
        "name": "iam-bene-portal-api",
        "dockerfile": "docker/iam-bene-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "1.1"
          }
        ]
      }
    ]

  CHART_PATH: deployments/charts/openg2p-iam-service
  CHART_IMAGE_PATHS: '[".iamStaffPortalApi.image.tag",".iamAgentPortalApi.image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts

  # openg2p-fastapi-common ref used by the test guards below. Kept separate from
  # the per-image `pins` above (those are docker build-args resolved to a SHA);
  # override it on a manual pipeline run to test against another ref.
  FASTAPI_COMMON_TEST_REF: "1.1"

# ─────────────────────────────────────────────────────────────────────────────
# Repo guards — lint + unit tests.
#
# Ported from the GitHub Actions workflows the migration left behind
# (pre-commit.yml, iam-core-test.yml, iam-staff-portal-api-test.yml). The
# migration script replaces only the build/publish caller; everything else stays
# as inert GitHub YAML that never runs on GitLab, so these are re-expressed here.
#
# STAGE: must be one of the stages the included pipeline declares —
# `stages: [version, build, chart, changelog]`. There is no `test` stage. Naming
# one that does not exist is not a per-job error: GitLab rejects the whole
# config, and the pipeline fails INSTANTLY with zero jobs, no YAML error and an
# empty failure_reason, which looks nothing like the mistake it is.
#
# `version` is the first stage, so a guard failure stops the build, chart and
# changelog stages before any image or chart is published.
# ─────────────────────────────────────────────────────────────────────────────
.guard:
  stage: version
  rules:
    # 1.2 is a frozen maintenance line — the GitHub workflows excluded it
    # (`branches-ignore: [1.2]`) and it stays excluded here.
    - if: $CI_COMMIT_BRANCH == "1.2"
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "1.2"
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH

# Each consolidated area is checked with its own pre-commit config, scoped to
# ONLY that area's files (via git ls-files of the path). The python packages
# share the root config; docker/ and deployments/ use their own lightweight
# configs so the python hooks (black/ruff/check-yaml) never run over Dockerfiles
# or Helm templates.
pre-commit:
  extends: .guard
  image: python:3.13-slim
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  cache:
    key: "pre-commit-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pre-commit
  parallel:
    matrix:
      - PROJECT: iam-core
        CONFIG: .pre-commit-config.yaml
      - PROJECT: iam-staff-portal-api
        CONFIG: .pre-commit-config.yaml
      - PROJECT: iam-agent-portal-api
        CONFIG: .pre-commit-config.yaml
      - PROJECT: iam-bene-portal-api
        CONFIG: .pre-commit-config.yaml
      - PROJECT: docker
        CONFIG: docker/.pre-commit-config.yaml
      - PROJECT: deployments
        CONFIG: deployments/.pre-commit-config.yaml
  before_script:
    # `git` is needed both for `git ls-files` and for pre-commit to clone hooks;
    # the slim image does not ship it.
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --no-cache-dir pre-commit
  script:
    - |
      if [ -z "$(git ls-files -- "$PROJECT/")" ]; then
        echo "No tracked files under $PROJECT/ — nothing to check."
        exit 0
      fi
      git ls-files -z -- "$PROJECT/" | xargs -0 pre-commit run \
        --config "$CONFIG" \
        --show-diff-on-failure --files

iam-core-test:
  extends: .guard
  image: python:3.12
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libmagic1
  script:
    - python -m pip install --upgrade pip
    # External lib (openg2p-fastapi-common) from git.
    - python -m pip install "git+https://github.com/openg2p/openg2p-fastapi-common@${FASTAPI_COMMON_TEST_REF}#subdirectory=openg2p-fastapi-common"
    # In-repo library (not on PyPI) + test tooling.
    - python -m pip install -e ./iam-core
    - python -m pip install pytest pytest-asyncio
    - pytest iam-core/tests

iam-staff-portal-api-test:
  extends: .guard
  image: python:3.12
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libmagic1
  script:
    - python -m pip install --upgrade pip
    - python -m pip install "git+https://github.com/openg2p/openg2p-fastapi-common@${FASTAPI_COMMON_TEST_REF}#subdirectory=openg2p-fastapi-common"
    - python -m pip install -e "./iam-core[dev]"
    - python -m pip install -e "./iam-staff-portal-api[dev]"
    - pytest iam-staff-portal-api/tests
